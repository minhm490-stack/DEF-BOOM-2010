<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💐 Chúc Mừng Ngày 20/10 💐</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d63031;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 16px;
            line-height: 1.5;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            font-weight: bold;
        }
        .btn:hover {
            background: #ff6b81;
        }
        #wish {
            display: none;
            margin-top: 20px;
            color: #e84393;
            font-weight: bold;
            font-size: 17px;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌸 Chúc Mừng 20/10 🌸</h1>
        <p>Nhấn vào nút bên dưới để mở món quà bất ngờ nhé!</p>
        <button class="btn" onclick="showWish()">Mở Quà 🎁</button>
        <div id="wish">Chúc bạn một ngày 20/10 ngập tràn niềm vui, luôn xinh đẹp, rạng rỡ, hạnh phúc và thành công rực rỡ trong cuộc sống! ✨💖</div>
    </div>

    <script>
        function showWish() {
            document.getElementById('wish').style.display = 'block';
        }
    </script>
</body>
</html>
